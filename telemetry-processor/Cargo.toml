[package]
name = "greyhook-telemetry-processor"
version = "0.1.0"
edition = "2021"

[lib]
name = "greyhook_telemetry_processor"
path = "src/lib.rs"

[[bin]]
name = "telemetry-processor"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
rdkafka = { version = "0.36", default-features = false, features = ["cmake-build", "ssl", "tokio"] }
sqlx = { version = "0.8", features = ["postgres", "uuid", "chrono", "runtime-tokio-rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
anyhow = "1"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
