[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greyhook-ai-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "haystack-ai>=2.9.0",
    "anthropic-haystack>=1.1.0",
    "kafka-python>=2.0.6",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
