[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greyhook-mes-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.4",
    "uvicorn[standard]==0.32.0",
    "sqlalchemy[asyncio]==2.0.36",
    "asyncpg==0.30.0",
    "alembic==1.14.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.6.0",
    "python-jose[cryptography]==3.3.0",
    "passlib[argon2]==1.7.4",
    "httpx==0.27.2",
    "temporalio==1.7.1",
    "aiokafka==0.11.0",
    "redis==5.2.0",
    "python-multipart==0.0.12",
    "structlog==24.4.0",
    "anthropic>=0.40",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "httpx==0.27.2",
    "factory-boy==3.3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
